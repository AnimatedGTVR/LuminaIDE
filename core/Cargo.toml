[package]
name = "lumina_core"
version = "0.2.0"
edition = "2021"
description = "LuminaIDE engine: workspace listing, file I/O and project search behind a C ABI"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
