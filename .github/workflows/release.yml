name: Downloads

# Push a tag like v0.2.0 to build installers for every platform and publish a GitHub Release
# whose notes come from CHANGELOG.md. See docs/RELEASING.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     rid: linux-x64,   kind: tar }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, kind: tar }
          - { os: macos-15,         rid: osx-arm64,   kind: mac }
          - { os: macos-15-intel,         rid: osx-x64,     kind: mac }
          - { os: windows-latest,   rid: win-x64,     kind: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' app/LuminaIDE.csproj | head -1)"
          test "v$APP_VERSION" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match <Version>$APP_VERSION</Version> in app/LuminaIDE.csproj"; exit 1; }

      - name: Test, build and package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File ./build.ps1 test
            pwsh -File ./build.ps1 package
          else
            ./build.sh test
            ./build.sh package
          fi

      - name: Build graphical launcher
        run: dotnet build tools/Builder/Builder.csproj -c Release --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: LuminaIDE-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: packaging/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/*
          draft: true   # review the notes and artifacts, then publish it from the GitHub UI
